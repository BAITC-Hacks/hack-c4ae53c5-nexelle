services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PORT: "8080"
      DATA_DIR: /app/data
      SNAPSHOT_DATE: "2026-10-01"
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
